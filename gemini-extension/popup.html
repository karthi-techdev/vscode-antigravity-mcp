<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini IDE Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1f24;
      color: #e3e3e3;
      box-sizing: border-box;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #9aa0a6;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #1557b0;
    }
    .status-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.green { background: rgba(52, 168, 83, 0.2); color: #34a853; }
    .badge.red { background: rgba(234, 67, 53, 0.2); color: #ea4335; }
  </style>
</head>
<body>
  <h2>⚡ Gemini IDE Bridge</h2>
  
  <div class="status-box">
    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
      <span>Bridge Status:</span>
      <span id="status-badge" class="badge red">Offline</span>
    </div>
    <div style="display:flex; justify-content:space-between;">
      <span>Active Project:</span>
      <span id="active-project" style="font-family:monospace; color:#a8c7fa;">None</span>
    </div>
  </div>

  <div class="field">
    <label>Cloud Gateway URL</label>
    <input type="text" id="gateway-url" value="https://vscode-antigravity-mcp.vercel.app">
  </div>

  <div class="field">
    <label>Auth Key</label>
    <input type="text" id="api-key" value="D4_PROJECT_MCP_SERVER">
  </div>

  <div class="row">
    <label style="margin:0; text-transform:none; font-size:12px; color:#e3e3e3;">Auto-Run Actions</label>
    <input type="checkbox" id="auto-run" checked>
  </div>

  <button class="btn" id="save-btn">Save & Test Connection</button>

  <script src="popup.js"></script>
</body>
</html>
