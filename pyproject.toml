[project]
name = "vscode-antigravity-mcp"
version = "0.1.0"
description = "Multi-Tenant MCP Server & Local IDE Bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mangum>=0.17.0",
]

[tool.vercel]
entrypoint = "server.app:app"
